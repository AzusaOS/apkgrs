name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --features bin,tools -- -D warnings
      - name: test
        run: cargo test --features bin,tools

  msrv:
    name: MSRV (Rust 1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --all-targets --features bin,tools

  aarch64:
    name: Cross-check aarch64 (raw syscall arm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64
      - run: cargo clippy --target aarch64-unknown-linux-gnu --features bin,tools -- -D warnings

  fullrust:
    name: Static libc-free build (fullrust) + VM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build with the fullrust toolchain
        uses: KarpelesLab/fullrust@master
        with:
          image: ghcr.io/karpeleslab/fullrust:latest
          args: --release --features bin,tools
      - name: Check the binary is static
        run: |
          f=target/x86_64-unknown-linux-fullrust/release/apkg
          file "$f"
          if readelf -d "$f" 2>/dev/null | grep -q NEEDED; then
            echo "::error::binary has dynamic dependencies"; exit 1
          fi
          "$f" -version
      - uses: dtolnay/rust-toolchain@stable
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86
      - name: Integration tests in a VM (FUSE mount, restart, eviction)
        env:
          # the fullrust build leaves a root-owned target/
          CARGO_TARGET_DIR: ${{ runner.temp }}/target
          VMTEST_DIR: ${{ runner.temp }}/vmtest
          VMTEST_WATCHDOG: "600"
        run: tests/vm/run.sh "$PWD/target/x86_64-unknown-linux-fullrust/release/apkg"
      - name: Keep the VM console log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vmtest-console
          path: ${{ runner.temp }}/vmtest/console.log

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --features bin,tools
        env:
          RUSTDOCFLAGS: -D warnings
